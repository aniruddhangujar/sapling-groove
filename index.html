
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sapling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #22c55e;
            --deep-forest: #040a04;
            --moss-surface: #0a160a;
            --forest-border: #1a2e1a;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: var(--deep-forest);
            color: #d1d5db;
            font-family: 'VT323', monospace;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(10, 20, 10, 0) 50%, rgba(0, 5, 0, 0.15) 50%), linear-gradient(90deg, rgba(20, 50, 20, 0.04), rgba(0, 255, 0, 0.01), rgba(20, 50, 20, 0.04));
            z-index: 999;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.2;
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
        }
        .pixel-corners {
            clip-path: polygon(
                0 4px, 4px 4px, 4px 0,
                calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%,
                4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)
            );
        }
        .hud-grid {
            background-image: radial-gradient(circle, #22c55e08 1.5px, transparent 1px);
            background-size: 40px 40px;
        }
        /* Ani Glow Effect */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(34, 197, 94, 0.1), inset 0 0 5px rgba(34, 197, 94, 0.05); }
            50% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.2), inset 0 0 10px rgba(34, 197, 94, 0.1); }
            100% { box-shadow: 0 0 10px rgba(34, 197, 94, 0.1), inset 0 0 5px rgba(34, 197, 94, 0.05); }
        }
        .ani-glow { animation: pulse-glow 3s infinite ease-in-out; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--deep-forest); }
        ::-webkit-scrollbar-thumb { background: var(--forest-border); }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body class="bg-[#040a04] w-full overflow-x-hidden">
    <div class="crt-overlay"></div>
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
